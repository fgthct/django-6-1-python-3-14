[project]
name = "vault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "fastembed>=0.8.1",
    "gunicorn>=26.2.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]   # assert nei test
[tool.ruff.lint.per-file-ignores]
"documenti/management/commands/crea_demo.py" = ["E501", "S106"]
"**/tests/*" = ["S105", "S106", "S311", "S603", "S607"]

[tool.coverage.run]
source = ["config", "documenti"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
