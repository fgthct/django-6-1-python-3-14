name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il token di questo workflow può solo leggere il repository: se un'azione viene compromessa, non può scrivere.
permissions:
  contents: read

# Un nuovo push sullo stesso ramo annulla l'esecuzione precedente, ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # uv non deve mai modificare uv.lock: se non è aggiornato, il lavoro fallisce

jobs:
  qualita:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Stile e formato
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Le migrazioni corrispondono ai modelli
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DEBUG: "1"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: vault
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - name: Test, con la copertura
        run: uv run pytest --cov
      - name: Verifiche di Django per la produzione
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          SECRET_KEY: ${{ github.sha }}-solo-per-il-controllo-in-ci-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: vault.esempio.it
          SMTP_HOST: smtp.esempio.it
          TRUST_PROXY_SSL: "1"

  immagine:
    runs-on: ubuntu-latest
    needs: [qualita, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configurazione di prova (nessun segreto vero)
        run: |
          pw=$(openssl rand -hex 16)
          cat > .env <<EOF
          DOMINIO=localhost
          ALLOWED_HOSTS=localhost
          CSRF_TRUSTED_ORIGINS=https://localhost
          SECRET_KEY=$(openssl rand -base64 48)
          POSTGRES_PASSWORD=$pw
          DB_NAME=vault
          DB_USER=vault
          DB_PASSWORD=$pw
          SMTP_HOST=localhost
          SMTP_TLS=0
          EMBEDDING_BACKEND=finto
          EOF
      - name: Costruzione e avvio dell'intero stack
        run: docker compose up -d --build --wait
      - name: Prova del fumo
        run: |
          curl -fsk https://localhost/salute/
          curl -fsk https://localhost/pronto/
          curl -fsk https://localhost/accedi/ -o /dev/null
      - name: Log, se qualcosa è andato storto
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
